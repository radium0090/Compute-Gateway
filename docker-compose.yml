name: rax-compute-gateway

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: compute_gateway
      POSTGRES_USER: rcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcg_dev_only}
    ports:
      - '127.0.0.1:${RCG_COMPOSE_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rcg -d compute_gateway']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.9-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${RCG_COMPOSE_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./deploy/compose/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test:
        [
          'CMD',
          '/otelcol-contrib',
          'validate',
          '--config=/etc/otelcol-contrib/config.yaml',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  migrate:
    image: ${RCG_IMAGE:-rax-compute-gateway:dev}
    build:
      context: .
      target: runtime
      args:
        VERSION: ${RCG_SERVICE_VERSION:-0.0.0-dev}
        REVISION: ${RCG_COMMIT_SHA:-unknown}
    command: ['migrate', 'up']
    env_file: .env
    volumes:
      - ./deploy/compose/rax-compute-gateway.yaml:/etc/rax-compute-gateway/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true

  gateway:
    image: ${RCG_IMAGE:-rax-compute-gateway:dev}
    build:
      context: .
      target: runtime
      args:
        VERSION: ${RCG_SERVICE_VERSION:-0.0.0-dev}
        REVISION: ${RCG_COMMIT_SHA:-unknown}
    env_file: .env
    volumes:
      - ./deploy/compose/rax-compute-gateway.yaml:/etc/rax-compute-gateway/config.yaml:ro
    ports:
      - '127.0.0.1:${RCG_COMPOSE_HTTP_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true
    stop_grace_period: 95s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
