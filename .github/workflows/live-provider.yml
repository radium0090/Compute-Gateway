name: Live provider smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-provider-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify required protected configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GENCHI_LIVE_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GENCHI_LIVE_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GENCHI_LIVE_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$ANTHROPIC_API_KEY"
          test -n "$GEMINI_API_KEY"
          test -n "$GENCHI_LIVE_OPENAI_MODEL"
          test -n "$GENCHI_LIVE_ANTHROPIC_MODEL"
          test -n "$GENCHI_LIVE_GEMINI_MODEL"
      - name: Run bounded live provider smoke
        env:
          GENCHI_LIVE_ENABLED: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GENCHI_LIVE_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GENCHI_LIVE_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GENCHI_LIVE_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: pnpm test:live
