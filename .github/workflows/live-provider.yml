name: Live provider smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Protected provider test suite
        type: choice
        options: [provider-smoke, agent-pilot]
        default: provider-smoke

permissions:
  contents: read

concurrency:
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.suite != 'agent-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-provider-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify required protected configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RCG_LIVE_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          RCG_LIVE_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          RCG_LIVE_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$ANTHROPIC_API_KEY"
          test -n "$GEMINI_API_KEY"
          test -n "$RCG_LIVE_OPENAI_MODEL"
          test -n "$RCG_LIVE_ANTHROPIC_MODEL"
          test -n "$RCG_LIVE_GEMINI_MODEL"
      - name: Run bounded live provider smoke
        env:
          RCG_LIVE_ENABLED: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RCG_LIVE_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          RCG_LIVE_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          RCG_LIVE_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: pnpm test:live

  agent-pilot:
    if: inputs.suite == 'agent-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-provider-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify synthetic decision on Gemini and OpenAI
        env:
          RCG_AGENT_PILOT_LIVE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RCG_LIVE_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RCG_LIVE_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: pnpm test:live apps/gateway/src/evaluation/agent-pilot.live.test.ts
