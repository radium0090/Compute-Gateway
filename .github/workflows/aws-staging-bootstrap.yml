name: AWS staging bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-staging
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: aws-staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_IAM_ROLE_NAME: ${{ vars.EC2_IAM_ROLE_NAME }}
      RCG_SECRET_ARN: ${{ vars.RCG_SECRET_ARN }}
      RCG_DEPLOY_PATH: ${{ vars.RCG_DEPLOY_PATH }}
    steps:
      - name: Validate protected environment variables
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ACCOUNT_ID
            AWS_ROLE_ARN
            EC2_INSTANCE_ID
            EC2_IAM_ROLE_NAME
            RCG_SECRET_ARN
            RCG_DEPLOY_PATH
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required aws-staging variable: ${name}" >&2
              exit 1
            fi
          done
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/ComputeGatewayGitHubDeployRole" ]]
          [[ "$RCG_SECRET_ARN" == "arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:rax/compute-gateway/staging/runtime-"* ]]
          [[ "$RCG_DEPLOY_PATH" =~ ^/opt/[a-z0-9][a-z0-9._/-]*$ ]]

      - name: Assume the protected AWS deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: rcg-bootstrap-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-duration-seconds: 1800

      - name: Verify the staging target
        shell: bash
        run: |
          set -euo pipefail
          read -r state profile http_tokens <<<"$(
            aws ec2 describe-instances \
              --instance-ids "$EC2_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].[State.Name,IamInstanceProfile.Arn,MetadataOptions.HttpTokens]' \
              --output text
          )"
          profile_name="${profile##*/}"
          ping_status="$(
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"
          [[ "$state" == running ]]
          [[ "$profile_name" == "$EC2_IAM_ROLE_NAME" ]]
          [[ "$http_tokens" == required ]]
          [[ "$ping_status" == Online ]]

      - name: Install staging host prerequisites
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'SCRIPT'
          set -euo pipefail

          secret_arn="$1"
          aws_region="$2"
          deploy_path="$3"
          bootstrap_log='/var/log/rax-compute-gateway-bootstrap.log'
          export DEBIAN_FRONTEND=noninteractive

          echo 'Installing base host packages.'
          apt-get update >"$bootstrap_log" 2>&1
          apt-get install -y ca-certificates curl git jq unzip >>"$bootstrap_log" 2>&1

          echo 'Installing Docker Engine from the signed Docker repository.'
          install -m 0755 -d /etc/apt/keyrings
          curl --fail --silent --show-error --location \
            https://download.docker.com/linux/ubuntu/gpg \
            --output /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' \
            "$architecture" "$VERSION_CODENAME" \
            >/etc/apt/sources.list.d/docker.list
          apt-get update >>"$bootstrap_log" 2>&1
          apt-get install -y \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin \
            >>"$bootstrap_log" 2>&1
          systemctl enable --now docker >>"$bootstrap_log" 2>&1

          echo 'Installing AWS CLI v2 from the official AWS distribution.'
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            --output "$work_dir/awscliv2.zip"
          unzip -q "$work_dir/awscliv2.zip" -d "$work_dir"
          if [[ -x /usr/local/aws-cli/v2/current/bin/aws ]]; then
            "$work_dir/aws/install" --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update \
              >>"$bootstrap_log" 2>&1
          else
            "$work_dir/aws/install" --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli \
              >>"$bootstrap_log" 2>&1
          fi

          install -d -m 0750 "$deploy_path"
          docker info >/dev/null

          echo "docker_version=$(docker version --format '{{.Server.Version}}')"
          echo "compose_version=$(docker compose version --short)"
          echo "aws_cli_version=$(aws --version 2>&1 | cut -d' ' -f1)"
          echo "git_version=$(git --version | cut -d' ' -f3)"

          secret_string="$(
            aws secretsmanager get-secret-value \
              --region "$aws_region" \
              --secret-id "$secret_arn" \
              --query SecretString \
              --output text
          )"
          secret_keys="$(
            printf '%s' "$secret_string" |
              jq -er 'if type == "object" then keys | sort | join(",") else error("secret must be a JSON object") end'
          )"
          unset secret_string
          printf 'secret_schema_keys=%s\n' "$secret_keys"
          echo 'bootstrap=ok'
          SCRIPT
          )"
          script_base64="$(printf '%s' "$remote_script" | base64 | tr -d '\n')"
          parameters="$(
            jq -cn \
              --arg script "$script_base64" \
              --arg secret "$RCG_SECRET_ARN" \
              --arg region "$AWS_REGION" \
              --arg path "$RCG_DEPLOY_PATH" \
              '{commands: ["printf %s " + ($script | @sh) + " | base64 -d | bash -s -- " + ($secret | @sh) + " " + ($region | @sh) + " " + ($path | @sh)]}'
          )"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'RAX Compute Gateway staging host bootstrap' \
              --timeout-seconds 900 \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          status='Pending'
          for _ in $(seq 1 450); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success) break ;;
              Failed | TimedOut | Cancelled | Cancelling)
                break
                ;;
            esac
            sleep 2
          done

          stdout="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardOutputContent \
              --output text
          )"
          printf '%s\n' "$stdout"

          if [[ "$status" != Success ]]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent \
              --output text >&2
            echo "SSM bootstrap command ended with status: ${status}" >&2
            exit 1
          fi

          grep -q '^bootstrap=ok$' <<<"$stdout"
