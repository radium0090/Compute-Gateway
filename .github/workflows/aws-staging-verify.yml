name: AWS staging verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_IAM_ROLE_NAME: ${{ vars.EC2_IAM_ROLE_NAME }}
      RCG_DEPLOY_PATH: ${{ vars.RCG_DEPLOY_PATH }}
    steps:
      - name: Validate protected verification context
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ACCOUNT_ID
            AWS_ROLE_ARN
            EC2_INSTANCE_ID
            EC2_IAM_ROLE_NAME
            RCG_DEPLOY_PATH
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required aws-staging variable: ${name}" >&2
              exit 1
            fi
          done
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/ComputeGatewayGitHubDeployRole" ]]
          [[ "$RCG_DEPLOY_PATH" =~ ^/opt/[a-z0-9][a-z0-9._/-]*$ ]]

      - name: Assume the protected AWS deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: rcg-verify-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Verify the staging target
        shell: bash
        run: |
          set -euo pipefail
          read -r state profile http_tokens <<<"$(
            aws ec2 describe-instances \
              --instance-ids "$EC2_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].[State.Name,IamInstanceProfile.Arn,MetadataOptions.HttpTokens]' \
              --output text
          )"
          profile_name="${profile##*/}"
          ping_status="$(
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"
          [[ "$state" == running ]]
          [[ "$profile_name" == "$EC2_IAM_ROLE_NAME" ]]
          [[ "$http_tokens" == required ]]
          [[ "$ping_status" == Online ]]

      - name: Verify providers and lifecycle through SSM
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'SCRIPT'
          set -euo pipefail

          deploy_path="$1"
          commit_sha="$2"
          repository_url='https://github.com/radium0090/Compute-Gateway.git'
          verification_root="${deploy_path}/verification/${commit_sha}"

          install -d -m 0750 "${deploy_path}/verification"
          if [[ -e "$verification_root" && ! -d "${verification_root}/.git" ]]; then
            echo 'The verification path exists but is not a Git checkout.' >&2
            exit 1
          fi
          if [[ ! -d "${verification_root}/.git" ]]; then
            git clone --filter=blob:none --no-checkout "$repository_url" "$verification_root"
          fi
          git -C "$verification_root" remote set-url origin "$repository_url"
          git -C "$verification_root" fetch --depth=1 origin "$commit_sha"
          git -C "$verification_root" checkout --detach "$commit_sha"
          [[ "$(git -C "$verification_root" rev-parse HEAD)" == "$commit_sha" ]]

          export RCG_DEPLOY_PATH="$deploy_path"
          exec "$verification_root/scripts/verify-aws-staging.sh"
          SCRIPT
          )"
          script_base64="$(printf '%s' "$remote_script" | base64 | tr -d '\n')"
          parameters="$(
            jq -cn \
              --arg script "$script_base64" \
              --arg path "$RCG_DEPLOY_PATH" \
              --arg commit "$GITHUB_SHA" \
              '{commands: ["printf %s " + ($script | @sh) + " | base64 -d | bash -s -- " + ($path | @sh) + " " + ($commit | @sh)]}'
          )"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "RAX Compute Gateway staging verification ${GITHUB_SHA}" \
              --timeout-seconds 1200 \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          status='Pending'
          for _ in $(seq 1 600); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success) break ;;
              Failed | TimedOut | Cancelled | Cancelling)
                break
                ;;
            esac
            sleep 2
          done

          stdout="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardOutputContent \
              --output text
          )"
          printf '%s\n' "$stdout"

          if [[ "$status" != Success ]]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent \
              --output text >&2
            echo "SSM verification command ended with status: ${status}" >&2
            exit 1
          fi

          grep -q '^staging_verification=ok$' <<<"$stdout"
