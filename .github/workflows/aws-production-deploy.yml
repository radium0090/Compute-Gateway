name: AWS production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_IAM_ROLE_NAME: ${{ vars.EC2_IAM_ROLE_NAME }}
      RCG_DEPLOY_PATH: ${{ vars.RCG_DEPLOY_PATH }}
      RCG_PUBLIC_HOST: ${{ vars.RCG_PUBLIC_HOST }}
      RCG_SECRET_ARN: ${{ vars.RCG_SECRET_ARN }}
    steps:
      - name: Validate protected production context
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ACCOUNT_ID
            AWS_ROLE_ARN
            EC2_INSTANCE_ID
            EC2_IAM_ROLE_NAME
            RCG_DEPLOY_PATH
            RCG_PUBLIC_HOST
            RCG_SECRET_ARN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required aws-production variable: ${name}" >&2
              exit 1
            fi
          done
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/ComputeGatewayGitHubDeployRole" ]]
          [[ "$RCG_SECRET_ARN" == "arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:rax/compute-gateway/production/runtime-"* ]]
          [[ "$RCG_DEPLOY_PATH" =~ ^/opt/[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$RCG_PUBLIC_HOST" == api.rax-digital.com ]]

      - name: Assume the protected AWS deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: rcg-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: Verify the production target
        shell: bash
        run: |
          set -euo pipefail
          read -r state profile http_tokens public_ip <<<"$(
            aws ec2 describe-instances \
              --instance-ids "$EC2_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].[State.Name,IamInstanceProfile.Arn,MetadataOptions.HttpTokens,PublicIpAddress]' \
              --output text
          )"
          profile_name="${profile##*/}"
          ping_status="$(
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"
          dns_ip="$(getent ahostsv4 "$RCG_PUBLIC_HOST" | awk 'NR == 1 { print $1 }')"
          [[ "$state" == running ]]
          [[ "$profile_name" == "$EC2_IAM_ROLE_NAME" ]]
          [[ "$http_tokens" == required ]]
          [[ "$ping_status" == Online ]]
          [[ -n "$dns_ip" && "$dns_ip" == "$public_ip" ]]

      - name: Deploy the approved main commit through SSM
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'SCRIPT'
          set -euo pipefail

          deploy_path="$1"
          commit_sha="$2"
          secret_arn="$3"
          aws_region="$4"
          public_host="$5"
          repository_url='https://github.com/radium0090/Compute-Gateway.git'
          release_root="${deploy_path}/releases/${commit_sha}"

          install -d -m 0750 "${deploy_path}/releases"
          if [[ -e "$release_root" && ! -d "${release_root}/.git" ]]; then
            echo 'The release path exists but is not a Git checkout.' >&2
            exit 1
          fi
          if [[ ! -d "${release_root}/.git" ]]; then
            git clone --filter=blob:none --no-checkout "$repository_url" "$release_root"
          fi
          git -C "$release_root" remote set-url origin "$repository_url"
          git -C "$release_root" fetch --depth=1 origin "$commit_sha"
          git -C "$release_root" checkout --detach "$commit_sha"
          [[ "$(git -C "$release_root" rev-parse HEAD)" == "$commit_sha" ]]

          export AWS_REGION="$aws_region"
          export RCG_COMMIT_SHA="$commit_sha"
          export RCG_DEPLOY_PATH="$deploy_path"
          export RCG_PUBLIC_HOST="$public_host"
          export RCG_SECRET_ARN="$secret_arn"
          exec "$release_root/scripts/deploy-aws-production.sh"
          SCRIPT
          )"
          script_base64="$(printf '%s' "$remote_script" | base64 | tr -d '\n')"
          parameters="$(
            jq -cn \
              --arg script "$script_base64" \
              --arg path "$RCG_DEPLOY_PATH" \
              --arg commit "$GITHUB_SHA" \
              --arg secret "$RCG_SECRET_ARN" \
              --arg region "$AWS_REGION" \
              --arg host "$RCG_PUBLIC_HOST" \
              '{commands: ["printf %s " + ($script | @sh) + " | base64 -d | bash -s -- " + ($path | @sh) + " " + ($commit | @sh) + " " + ($secret | @sh) + " " + ($region | @sh) + " " + ($host | @sh)]}'
          )"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "RAX Compute Gateway production deploy ${GITHUB_SHA}" \
              --timeout-seconds 2100 \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          status='Pending'
          for _ in $(seq 1 1050); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success) break ;;
              Failed | TimedOut | Cancelled | Cancelling) break ;;
            esac
            sleep 2
          done

          stdout="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardOutputContent \
              --output text
          )"
          printf '%s\n' "$stdout"
          if [[ "$status" != Success ]]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent \
              --output text >&2
            echo "SSM production deployment ended with status: ${status}" >&2
            exit 1
          fi
          grep -q '^production_deployment=ok$' <<<"$stdout"

      - name: Verify the public HTTPS edge
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "https://${RCG_PUBLIC_HOST}/health/live" >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            "https://${RCG_PUBLIC_HOST}/health/ready" >/dev/null
          metrics_status="$(
            curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              "https://${RCG_PUBLIC_HOST}/metrics"
          )"
          [[ "$metrics_status" == 404 ]]
