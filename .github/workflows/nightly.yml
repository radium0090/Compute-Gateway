name: Nightly

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: genchi
          POSTGRES_USER: genchi
          POSTGRES_PASSWORD: nightly-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U genchi -d genchi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.9-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Run full and integration suites
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:coverage
          pnpm test:integration
        env:
          GENCHI_TEST_DATABASE_URL: postgresql://genchi:nightly-only@127.0.0.1:5432/genchi
          GENCHI_TEST_REDIS_URL: redis://127.0.0.1:6379
