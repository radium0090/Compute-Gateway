name: Nightly

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: compute_gateway
          POSTGRES_USER: rcg
          POSTGRES_PASSWORD: nightly-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rcg -d compute_gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.9-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Run full and integration suites
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:coverage
          pnpm test:integration
        env:
          RCG_TEST_DATABASE_URL: postgresql://rcg:nightly-only@127.0.0.1:5432/compute_gateway
          RCG_TEST_REDIS_URL: redis://127.0.0.1:6379
