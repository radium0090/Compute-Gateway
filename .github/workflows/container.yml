name: Container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build local candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: rax-compute-gateway:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify configuration in hardened runtime
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$PWD/deploy/compose/rax-compute-gateway.yaml:/etc/rax-compute-gateway/config.yaml:ro" \
            -e RCG_ENVIRONMENT=production \
            -e RCG_DATABASE_URL=postgresql://rcg:fake@postgres.invalid:5432/compute_gateway \
            -e RCG_REDIS_URL=rediss://redis.invalid:6379 \
            -e RCG_KEY_HASH_PEPPER=fake-pepper-with-at-least-32-characters \
            -e OPENAI_API_KEY=fake-openai \
            -e ANTHROPIC_API_KEY=fake-anthropic \
            -e GEMINI_API_KEY=fake-gemini \
            rax-compute-gateway:ci --check-config
          if docker run --rm --entrypoint /bin/sh rax-compute-gateway:ci -c true; then
            echo "runtime image unexpectedly contains a shell" >&2
            exit 1
          fi
      - name: Exercise fresh-clone Compose bootstrap
        env:
          RCG_IMAGE: rax-compute-gateway:ci
          RCG_SMOKE_NO_BUILD: 'true'
        run: |
          cp .env.example .env
          sh scripts/smoke-compose.sh
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: rax-compute-gateway:ci
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          cache: false
      - name: Generate candidate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: rax-compute-gateway:ci
          format: spdx-json
          output-file: rax-compute-gateway-ci.spdx.json
          syft-version: v1.44.0
          upload-release-assets: false
          upload-artifact: false
      - name: Upload candidate SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rax-compute-gateway-ci-sbom
          path: rax-compute-gateway-ci.spdx.json
          retention-days: 7
          if-no-files-found: error
