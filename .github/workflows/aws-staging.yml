name: AWS staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-staging
  cancel-in-progress: false

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aws-staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_IAM_ROLE_NAME: ${{ vars.EC2_IAM_ROLE_NAME }}
      RCG_SECRET_ARN: ${{ vars.RCG_SECRET_ARN }}
      RCG_DEPLOY_PATH: ${{ vars.RCG_DEPLOY_PATH }}
    steps:
      - name: Validate protected environment variables
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ACCOUNT_ID
            AWS_ROLE_ARN
            EC2_INSTANCE_ID
            EC2_IAM_ROLE_NAME
            RCG_SECRET_ARN
            RCG_DEPLOY_PATH
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required aws-staging variable: ${name}" >&2
              exit 1
            fi
          done
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]; then
            echo 'EC2_INSTANCE_ID must be a full EC2 instance ID.' >&2
            exit 1
          fi
          if [[ "$AWS_ROLE_ARN" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/ComputeGatewayGitHubDeployRole" ]]; then
            echo 'AWS_ROLE_ARN does not identify the expected deployment role.' >&2
            exit 1
          fi
          if [[ "$RCG_SECRET_ARN" != "arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:rax/compute-gateway/staging/runtime-"* ]]; then
            echo 'RCG_SECRET_ARN is outside the expected staging secret path.' >&2
            exit 1
          fi
          if [[ "$RCG_DEPLOY_PATH" != /opt/* ]]; then
            echo 'RCG_DEPLOY_PATH must be located below /opt.' >&2
            exit 1
          fi

      - name: Assume the protected AWS deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: rcg-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-duration-seconds: 900

      - name: Verify the staging target
        shell: bash
        run: |
          set -euo pipefail

          account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account" != "$AWS_ACCOUNT_ID" ]]; then
            echo 'The assumed role belongs to an unexpected AWS account.' >&2
            exit 1
          fi

          read -r state profile http_tokens <<<"$(
            aws ec2 describe-instances \
              --instance-ids "$EC2_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].[State.Name,IamInstanceProfile.Arn,MetadataOptions.HttpTokens]' \
              --output text
          )"
          profile_name="${profile##*/}"
          printf 'ec2_state=%s\n' "$state"
          printf 'instance_profile=%s\n' "$profile_name"
          printf 'imds_http_tokens=%s\n' "$http_tokens"

          if [[ "$state" != running ]]; then
            echo "The staging EC2 instance is not running (state=${state})." >&2
            exit 1
          fi
          if [[ "$profile_name" != "$EC2_IAM_ROLE_NAME" ]]; then
            echo "The EC2 instance profile does not match EC2_IAM_ROLE_NAME (profile=${profile_name})." >&2
            exit 1
          fi
          if [[ "$http_tokens" != required ]]; then
            echo "IMDSv2 is not enforced (HttpTokens=${http_tokens})." >&2
            exit 1
          fi

          ping_status="$(
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"
          printf 'ssm_ping_status=%s\n' "$ping_status"
          if [[ "$ping_status" != Online ]]; then
            echo "The staging EC2 instance is not online in Systems Manager (PingStatus=${ping_status})." >&2
            exit 1
          fi

          echo 'AWS identity, EC2 target, instance profile, IMDSv2, and SSM status are valid.'

      - name: Run a read-only command through SSM
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'SCRIPT'
          set -eu
          . /etc/os-release
          printf 'os=%s\n' "$PRETTY_NAME"
          printf 'arch=%s\n' "$(uname -m)"
          if command -v docker >/dev/null 2>&1; then
            echo 'docker=installed'
          else
            echo 'docker=absent'
          fi
          if command -v aws >/dev/null 2>&1; then
            echo 'aws_cli=installed'
          else
            echo 'aws_cli=absent'
          fi
          echo 'ssm=ok'
          SCRIPT
          )"
          parameters="$(jq -cn --arg command "$remote_script" '{commands: [$command]}')"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment 'RAX Compute Gateway staging read-only connectivity check' \
              --timeout-seconds 120 \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          status='Pending'
          for _ in $(seq 1 60); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success) break ;;
              Failed | TimedOut | Cancelled | Cancelling)
                break
                ;;
            esac
            sleep 2
          done

          stdout="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardOutputContent \
              --output text
          )"
          printf '%s\n' "$stdout"

          if [[ "$status" != Success ]]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent \
              --output text >&2
            echo "SSM connectivity command ended with status: ${status}" >&2
            exit 1
          fi

          grep -q '^ssm=ok$' <<<"$stdout"
